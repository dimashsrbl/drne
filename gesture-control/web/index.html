<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Control · Drone Model</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b1020; color: #e5e7eb; font-family: ui-sans-serif, system-ui; }
      #wrap { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
      #view { position: relative; }
      #hud {
        padding: 16px; border-left: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
      }
      .k { opacity: 0.7; font-size: 12px; }
      .v { font-size: 14px; font-weight: 700; margin: 4px 0 14px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .ok { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
      .warn { background: rgba(234,179,8,0.15); color: #fbbf24; border: 1px solid rgba(234,179,8,0.35); }
      canvas { display:block; width:100%; height:100%; }
      a { color: #93c5fd; text-decoration: none; }
      code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="view"></div>
      <div id="hud">
        <div class="k">Статус</div>
        <div class="v"><span id="status" class="badge warn">DISCONNECTED</span></div>

        <div class="k">Источник</div>
        <div class="v" id="source">—</div>

        <div class="k">Roll / Pitch / Yaw (deg)</div>
        <div class="v" id="rpy">—</div>

        <div class="k">WebSocket</div>
        <div class="v"><code id="wsurl"></code></div>

        <div class="k">Подсказка</div>
        <div class="v" style="font-weight: 500; line-height: 1.35; opacity: 0.9;">
          Запусти Python мост: <code>ws_imu_bridge.py --simulate</code><br/>
          Затем открой эту страницу.<br/>
          Модель — примитивный “дрончик”, который повторяет ориентацию.
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";

      const WS_URL = `ws://${location.hostname}:8765`;
      document.getElementById("wsurl").textContent = WS_URL;

      const view = document.getElementById("view");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(devicePixelRatio);
      view.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x0b1020, 3, 20);

      const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
      camera.position.set(3.2, 2.4, 4.4);

      const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
      light1.position.set(4, 6, 3);
      scene.add(light1);
      scene.add(new THREE.AmbientLight(0x99aaff, 0.35));

      // “дрончик” из примитивов, чтобы не тащить 3D модели
      const drone = new THREE.Group();
      scene.add(drone);

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.2, roughness: 0.55 });
      const armMat  = new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.15, roughness: 0.7 });
      const propMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.05, roughness: 0.8 });

      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 0.7), bodyMat);
      body.position.y = 0.25;
      drone.add(body);

      const cam = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.25), new THREE.MeshStandardMaterial({ color: 0x60a5fa }));
      cam.position.set(0.55, 0.22, 0);
      drone.add(cam);

      function arm(x, z) {
        const a = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 0.12), armMat);
        a.position.set(0, 0.27, 0);
        a.rotation.y = Math.atan2(z, x);
        const g = new THREE.Group();
        g.position.set(0, 0, 0);
        g.add(a);
        const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.12, 20), armMat);
        motor.rotation.x = Math.PI / 2;
        motor.position.set(x, 0.29, z);
        g.add(motor);
        const prop = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.02, 10, 40), propMat);
        prop.rotation.x = Math.PI / 2;
        prop.position.set(x, 0.33, z);
        g.add(prop);
        return g;
      }

      drone.add(arm( 0.85,  0.55));
      drone.add(arm(-0.85,  0.55));
      drone.add(arm( 0.85, -0.55));
      drone.add(arm(-0.85, -0.55));

      // сетка “пол”
      const grid = new THREE.GridHelper(20, 20, 0x334155, 0x1f2937);
      grid.position.y = 0;
      scene.add(grid);

      function resize() {
        const w = view.clientWidth;
        const h = view.clientHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);
      resize();

      let ws;
      let lastMsgAt = 0;

      function setStatus(ok, text) {
        const el = document.getElementById("status");
        el.className = `badge ${ok ? "ok" : "warn"}`;
        el.textContent = text;
      }

      function connect() {
        setStatus(false, "CONNECTING");
        ws = new WebSocket(WS_URL);

        ws.onopen = () => setStatus(true, "CONNECTED");
        ws.onclose = () => { setStatus(false, "DISCONNECTED"); setTimeout(connect, 700); };
        ws.onerror = () => { /* ignore */ };

        ws.onmessage = (ev) => {
          lastMsgAt = performance.now();
          const data = JSON.parse(ev.data);
          const r = data?.rpy_deg?.roll ?? 0;
          const p = data?.rpy_deg?.pitch ?? 0;
          const y = data?.rpy_deg?.yaw ?? 0;

          document.getElementById("source").textContent = data?.source ?? "—";
          document.getElementById("rpy").textContent = `${r.toFixed(1)} / ${p.toFixed(1)} / ${y.toFixed(1)}`;

          // Конвенция: roll=X, pitch=Z, yaw=Y (типично для визуализации)
          const roll  = THREE.MathUtils.degToRad(r);
          const pitch = THREE.MathUtils.degToRad(p);
          const yaw   = THREE.MathUtils.degToRad(y);

          const q = new THREE.Quaternion();
          q.setFromEuler(new THREE.Euler(pitch, yaw, roll, "XYZ"));
          drone.quaternion.slerp(q, 0.35);
        };
      }
      connect();

      function animate() {
        requestAnimationFrame(animate);
        // если связь подвисла — статус желтеет
        const dt = performance.now() - lastMsgAt;
        if (ws?.readyState === WebSocket.OPEN && lastMsgAt && dt > 1200) {
          setStatus(false, "STALE");
        }
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
